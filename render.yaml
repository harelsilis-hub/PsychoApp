services:
  - type: web
    name: psychoapp-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python emergency_restore.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://psychoapp-il.vercel.app,https://frontend-one-mu-68.vercel.app,https://www.milawords.site,https://milawords.site
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://psychoapp-il.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
